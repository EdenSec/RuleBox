<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuleBox · 安全语法与 Payload 速取</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="rb-app">
    <!-- 顶部栏：品牌 + 全局操作 -->
    <header class="rb-header">
      <div class="rb-brand">
        <span class="rb-logo" aria-hidden="true">&gt;_</span>
        <span class="rb-brand-text">
          <span class="rb-brand-name">RuleBox</span>
          <span class="rb-brand-sub">安全语法与 Payload 速取</span>
        </span>
      </div>
      <div class="rb-header-actions">
        <button id="btn-favorites" class="rb-btn rb-btn--ghost rb-btn--icon" type="button"
          title="只看收藏" aria-label="只看收藏" aria-pressed="false"></button>
        <button id="btn-theme" class="rb-btn rb-btn--ghost rb-btn--icon" type="button"
          title="切换主题" aria-label="切换主题"></button>
        <button id="btn-sidepanel" class="rb-btn rb-btn--ghost rb-btn--icon" type="button"
          title="在侧边栏打开" aria-label="在侧边栏打开">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="15" y1="4" x2="15" y2="20"></line>
          </svg>
        </button>
        <button id="btn-options" class="rb-btn rb-btn--ghost rb-btn--icon" type="button"
          title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .66.39 1.26 1 1.51H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 搜索栏：语法库与 Payload 共用 -->
    <div id="searchbar" class="rb-searchbar">
      <div class="rb-search">
        <svg class="rb-search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input id="search-input" class="rb-input rb-search-input" type="search"
          placeholder="搜索标题、语法、字段或标签…" autocomplete="off" spellcheck="false"
          aria-label="搜索语法与 Payload">
        <button id="search-clear" class="rb-search-clear" type="button" title="清空搜索"
          aria-label="清空搜索" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
        <kbd class="rb-kbd">Ctrl K</kbd>
      </div>
    </div>

    <!-- 标签切换 -->
    <nav class="rb-tabs" role="tablist" aria-label="功能切换">
      <button id="tab-snippets" class="rb-tab is-active" type="button" role="tab" data-tab="snippets"
        aria-selected="true" aria-controls="panel-snippets">语法库</button>
      <button id="tab-payloads" class="rb-tab" type="button" role="tab" data-tab="payloads"
        aria-selected="false" aria-controls="panel-payloads">Payload</button>
      <button id="tab-cyber" class="rb-tab" type="button" role="tab" data-tab="cyber"
        aria-selected="false" aria-controls="panel-cyber">聚合查询</button>
      <button id="tab-ai" class="rb-tab" type="button" role="tab" data-tab="ai"
        aria-selected="false" aria-controls="panel-ai">AI 助手</button>
    </nav>

    <!-- 内容区 -->
    <main class="rb-content">
      <!-- 语法库 -->
      <section id="panel-snippets" class="rb-panel" data-panel="snippets" role="tabpanel"
        aria-labelledby="tab-snippets">
        <div class="rb-filter-block">
          <div class="rb-filter-row rb-filter-row--inline">
            <label class="rb-select-wrap">
              <span class="rb-select-label">平台</span>
              <select id="platform-select" class="rb-select rb-select--filter" aria-label="平台筛选"></select>
            </label>
            <label class="rb-select-wrap">
              <span class="rb-select-label">分类</span>
              <select id="snippet-category-select" class="rb-select rb-select--filter"
                aria-label="语法分类筛选"></select>
            </label>
            <button id="btn-add-snippet" class="rb-btn rb-btn--ghost rb-filter-add" type="button"
              title="新增语法条目" aria-label="新增语法条目">+</button>
          </div>
        </div>
        <!-- 列表不做 live region：每次筛选/搜索都会整体重建几十张卡片，
             逐条播报会淹没读屏软件；结果条数由页脚 #footer-count 统一播报 -->
        <div id="snippet-list" class="rb-list"></div>
      </section>

      <!-- Payload -->
      <section id="panel-payloads" class="rb-panel" data-panel="payloads" role="tabpanel"
        aria-labelledby="tab-payloads" hidden>
        <div class="rb-filter-block">
          <div class="rb-filter-row rb-filter-row--inline">
            <label class="rb-select-wrap">
              <span class="rb-select-label">类型</span>
              <select id="payload-group" class="rb-select rb-select--filter" aria-label="Payload 类型"></select>
            </label>
            <label class="rb-select-wrap">
              <span class="rb-select-label">分类</span>
              <select id="payload-category-select" class="rb-select rb-select--filter"
                aria-label="Payload 分类筛选"></select>
            </label>
            <button id="btn-add-payload" class="rb-btn rb-btn--ghost rb-filter-add" type="button"
              title="新增 Payload" aria-label="新增 Payload">+</button>
          </div>
        </div>
        <div id="payload-list" class="rb-list"></div>
      </section>

      <!-- 聚合查询 -->
      <section id="panel-cyber" class="rb-panel rb-cyber" data-panel="cyber" role="tabpanel"
        aria-labelledby="tab-cyber" hidden>
        <div class="rb-cyber-toolbar">
          <div class="rb-cyber-picker">
            <select id="cyber-provider-select" class="rb-select rb-cyber-single" aria-label="查询平台"></select>
            <button id="cyber-providers-btn" class="rb-btn rb-btn--ghost rb-btn--sm rb-cyber-picker-btn"
              type="button" aria-haspopup="true" aria-expanded="false" aria-controls="cyber-providers-pop" hidden>
              <span class="rb-cyber-picker-label">平台</span>
              <span id="cyber-providers-text" class="rb-cyber-picker-text">FOFA</span>
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 6.5 3 3 3-3"></path>
              </svg>
            </button>
            <div id="cyber-providers-pop" class="rb-cyber-pop" role="group"
              aria-label="选择查询平台" hidden></div>
          </div>
          <button id="cyber-mode-btn" class="rb-btn rb-btn--ghost rb-btn--sm rb-cyber-mode-btn" type="button"
            aria-pressed="false" title="切换到多平台同时查询">多选</button>
          <label class="rb-cyber-size">
            <span>每页</span>
            <select id="cyber-page-size" class="rb-select" aria-label="每页结果数量">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </label>
        </div>

        <form id="cyber-form" class="rb-cyber-form">
          <textarea id="cyber-query" class="rb-input rb-textarea" rows="2"
            placeholder='domain="example.com"'
            autocomplete="off" spellcheck="false" aria-label="查询语法"></textarea>
          <div class="rb-cyber-form-foot">
            <span id="cyber-hint" class="rb-cyber-hint">支持所选平台原生语法，Ctrl+Enter 查询</span>
            <button id="cyber-submit" class="rb-btn rb-btn--primary rb-btn--sm" type="submit">查询</button>
          </div>
        </form>

        <div id="cyber-notice" class="rb-cyber-notice" hidden></div>
        <div class="rb-cyber-statusbar">
          <div id="cyber-status" class="rb-cyber-status" role="status" aria-live="polite"></div>
          <div id="cyber-actions" class="rb-cyber-actions" hidden>
            <button id="cyber-copy-all" class="rb-btn rb-btn--ghost rb-btn--sm" type="button"
              title="复制当前页全部资产地址，每行一条">复制全部</button>
            <button id="cyber-export" class="rb-btn rb-btn--ghost rb-btn--sm" type="button"
              title="导出当前页结果为 JSON 文件，含平台、语法与完整字段">导出</button>
          </div>
        </div>
        <div id="cyber-results" class="rb-cyber-results"></div>
        <div id="cyber-pager" class="rb-cyber-pager" hidden></div>
      </section>

      <!-- AI 助手 -->
      <section id="panel-ai" class="rb-panel rb-ai" data-panel="ai" role="tabpanel"
        aria-labelledby="tab-ai" hidden>
        <div class="rb-ai-toolbar">
          <label class="rb-select-wrap">
            <span class="rb-select-label">目标</span>
            <select id="ai-platform" class="rb-select rb-select--sm" aria-label="目标平台"></select>
          </label>
          <label class="rb-select-wrap">
            <span class="rb-select-label">模型</span>
            <select id="ai-profile" class="rb-select rb-select--sm" aria-label="切换模型档案"
              title="切换模型档案，管理请到设置 → AI"></select>
          </label>
          <span id="ai-status" class="rb-ai-status" data-state="off">未启用</span>
          <button id="ai-clear" class="rb-btn rb-btn--ghost rb-btn--sm" type="button">清空对话</button>
        </div>

        <div id="ai-config-notice" class="rb-ai-notice" hidden>
          <span id="ai-config-notice-text" class="rb-ai-notice-text"></span>
          <button id="ai-config-action" class="rb-btn rb-btn--ghost rb-btn--sm" type="button">去配置 AI</button>
        </div>

        <div id="ai-messages" class="rb-ai-messages" aria-live="polite"></div>

        <div class="rb-ai-prompts">
          <div class="rb-filter-row">
            <label class="rb-select-wrap">
              <span class="rb-select-label">场景</span>
              <select id="ai-prompt-group-select" class="rb-select rb-select--filter"
                aria-label="提示词场景"></select>
            </label>
          </div>
          <div id="ai-prompts" class="rb-prompt-list"></div>
        </div>

        <form id="ai-form" class="rb-ai-form">
          <textarea id="ai-input" class="rb-input rb-textarea" rows="2"
            placeholder="用自然语言描述需求，例如：查询响应码为 200 的告警…"
            autocomplete="off" spellcheck="false" aria-label="向 AI 描述需求"></textarea>
          <button id="ai-send" class="rb-btn rb-btn--primary rb-ai-send" type="submit" title="发送（Ctrl+Enter）">
            <span>发送</span>
          </button>
        </form>
      </section>
    </main>

    <!-- 页脚状态 -->
    <footer class="rb-footer">
      <!-- 结果条数是唯一的结果播报点（role=status 自带 polite + 原子播报） -->
      <span id="footer-count" class="rb-footer-count" role="status" aria-atomic="true">加载中…</span>
      <span id="footer-hint" class="rb-footer-hint">Ctrl+K 搜索</span>
      <!-- 有隐藏条目时才出现：一眼能看到入口，不必回想设置页在哪 -->
      <button id="footer-hidden" class="rb-footer-link" type="button" hidden></button>
    </footer>
  </div>

  <script type="module" src="../ui/app.js"></script>
</body>
</html>
